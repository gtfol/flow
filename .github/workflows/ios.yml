name: iPhone build and tests
on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Core unit tests on macOS
        run: swift test --scratch-path "$RUNNER_TEMP/FlowCore"
  ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- Flow.xcodeproj
      - name: Build simulator and device, test on an iPhone simulator
        run: FLOW_DERIVED_DATA="$RUNNER_TEMP/FlowDerivedData" FLOW_RESULT_BUNDLE="$RUNNER_TEMP/FlowTests.xcresult" scripts/test-ios.sh
      - name: Export native screen captures
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/FlowTests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/FlowTests.xcresult" --output-path "$RUNNER_TEMP/FlowScreenshots"
          fi
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/FlowScreenshots
          if-no-files-found: ignore
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/FlowTests.xcresult
          if-no-files-found: ignore
